name: Compila APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Controlla SDK preinstallato
        id: sdk
        run: |
          if [ -f "$ANDROID_HOME/platforms/android-35/android.jar" ] && [ -x "$ANDROID_HOME/build-tools/34.0.0/apksigner" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "SDK Android disponibile"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configura SDK se necessario
        if: steps.sdk.outputs.ready != 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Estrai progetto
        run: unzip -q android-project.zip -d android-project

      - name: Test logica e sintassi JS
        working-directory: android-project
        run: |
          node --test tests/market.test.js
          node --check app/src/main/assets/local.js
          node --check app/src/main/assets/app.js

      - name: Compila APK
        working-directory: android-project
        run: gradle --no-daemon :app:assembleDebug

      - name: Verifica firma APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs android-project/app/build/outputs/apk/debug/app-debug.apk
          cp android-project/app/build/outputs/apk/debug/app-debug.apk Market-Briefing.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Market-Briefing-APK
          path: Market-Briefing.apk
          retention-days: 7
